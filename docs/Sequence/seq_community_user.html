<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sequence - Community User</title>
<script src="https://cdn.jsdelivr.net/npm/plantuml-encoder/dist/plantuml-encoder.min.js"></script>
</head>
<body style="text-align:center;font-family:Arial;">
<h2>Sequence Diagram - Community (User)</h2>
<img id="d">
<script>
const code = `
@startuml
actor User
participant "Web App" as App
database DB

User -> App : Open Feed
App -> DB : Fetch Posts
DB --> App : Posts
App --> User : Display Feed

alt Create Post
  User -> App : Submit Post
  App -> DB : Insert Post
  App --> User : Refresh Feed
end

alt Edit/Delete
  App -> DB : Check Ownership
  App -> DB : Update/Delete
  App --> User : Updated Feed
end

alt React
  App -> DB : Toggle Reaction
end

alt Comment
  User -> App : Add Comment
  App -> DB : Save Comment
end
@enduml
`;
const e = plantumlEncoder.encode(code);
document.getElementById("d").src="https://www.plantuml.com/plantuml/svg/"+e;
</script>
</body>
</html>
