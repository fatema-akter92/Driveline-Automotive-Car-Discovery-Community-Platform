<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sequence - Car Review</title>
<script src="https://cdn.jsdelivr.net/npm/plantuml-encoder/dist/plantuml-encoder.min.js"></script>
</head>
<body style="text-align:center;font-family:Arial;">
<h2>Sequence Diagram - Car Review</h2>
<img id="d">
<script>
const code = `
@startuml
actor User
participant "Web App" as App
database DB

User -> App : View Car Details
App -> DB : Fetch Car + Reviews
DB --> App : Data
App --> User : Display Page

alt Write Review
  App -> DB : Check Duplicate
  DB --> App : Result
  alt Allowed
    App -> DB : Insert Review
    App --> User : Success
  else Not Allowed
    App --> User : Reject
  end
end

alt Edit/Delete
  App -> DB : Verify Ownership
  DB --> App : Result
  App -> DB : Update/Delete Review
  App --> User : Updated
end

alt Like/Unlike
  App -> DB : Toggle Reaction
  App --> User : Updated
end
@enduml
`;
const e = plantumlEncoder.encode(code);
document.getElementById("d").src="https://www.plantuml.com/plantuml/svg/"+e;
</script>
</body>
</html>
