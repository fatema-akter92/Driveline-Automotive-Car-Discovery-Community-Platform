<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Authentication Use Case Diagram</title>
  <script src="https://cdn.jsdelivr.net/npm/plantuml-encoder/dist/plantuml-encoder.min.js"></script>
</head>
<body style="text-align:center; font-family:Arial;">

<h2>Authentication Use Case Diagram</h2>
<img id="diagram">

<script>
const code = `
@startuml
left to right direction
skinparam shadowing false
skinparam packageStyle rectangle
skinparam actorStyle awesome
skinparam usecase {
  BackgroundColor #F7FBFF
  BorderColor #1B4D7A
}

actor Guest
actor "MySQL Database Server" as DB
actor "PHP Session Engine" as Session

rectangle "Driveline Web Application" {
  package "Public Authentication" {
    (Access Landing)
    (Navigate to Login/Register)
    (Submit Login)
    (Validate Credentials)
    (Create Session)
    (Submit Registration)
    (Validate Registration Input)
    (Check Email Uniqueness)
    (Create Account)
  }

  package "Protected Access" {
    (Access Protected Page)
    (Verify Session)
    (Check Timeout)
    (Refresh Activity)
    (Redirect to Login)
  }

  Guest --> (Access Landing)
  (Access Landing) ..> (Navigate to Login/Register) : <<extend>>

  Guest --> (Submit Login)
  (Submit Login) ..> (Validate Credentials) : <<include>>
  (Submit Login) ..> (Create Session) : <<include>>

  Guest --> (Submit Registration)
  (Submit Registration) ..> (Validate Registration Input) : <<include>>
  (Submit Registration) ..> (Check Email Uniqueness) : <<include>>
  (Submit Registration) ..> (Create Account) : <<include>>

  (Access Protected Page) ..> (Verify Session) : <<include>>
  (Access Protected Page) ..> (Check Timeout) : <<include>>
  (Access Protected Page) ..> (Refresh Activity) : <<include>>
  (Redirect to Login) ..> (Access Protected Page) : <<extend>>

  (Validate Credentials) --> DB
  (Check Email Uniqueness) --> DB
  (Create Account) --> DB

  (Create Session) --> Session
  (Verify Session) --> Session
  (Check Timeout) --> Session
  (Refresh Activity) --> Session
}
@enduml
`;

const encoded = plantumlEncoder.encode(code);
document.getElementById("diagram").src =
  "https://www.plantuml.com/plantuml/svg/" + encoded;
</script>

</body>
</html>
